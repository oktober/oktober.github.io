<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>

    {% include meta.html %}

    <!--[if lt IE 9]>
      <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

    <link rel="shortcut icon" type="image/png" href="{{ site.favicon }}" />
    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />

    <!-- Created with Jekyll Now - http://github.com/barryclark/jekyll-now -->
  </head>

  <body>
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead clearfix">
          <!-- <a href="{{ site.baseurl }}/" class="site-avatar"><img src="{{ site.avatar }}" alt="Picture of Stacie Farmer" /></a> -->

          <div class="site-info">
            <h1 class="site-name"><a href="{{ site.baseurl }}/">{{ site.name }}</a></h1>
            <p class="site-description">{{ site.description }}</p>
          </div>

          <nav id="menu">
            <ul class="nav">
              <li class="top-level"><a href="{{ site.baseurl }}/">Home</a></li>
              <li class="top-level"><a href="{{ site.baseurl }}/blog">Writing</a>
                <ul>
                  <li><a href="{{ site.baseurl }}/owasp-top-10">OWASP Top 10</a></li>
                  <li><a href="{{ site.baseurl }}/tutorials">Tutorials</a></li>
                  <li><a href="{{ site.baseurl }}/blog">Blog</a></li>
                </ul>
              </li>
              <li class="top-level"><a href="{{ site.baseurl }}/talks">Talks</a></li>
              <li class="top-level"><a href="{{ site.baseurl }}/about">About</a>
                <ul>
                  <li><a href="{{ site.baseurl }}/coding">Code</a></li>
                </ul>
              </li>
            </ul>
          </nav>
        </header>
      </div>
    </div>

    <main class="main container">
      {{ content }}
    </main>

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          <p>{% include svg-icons.html %}</p>
          
          <p class="footer-text">&copy; Stacie Farmer - 2023 | <a href="{{ site.baseurl }}/terms-privacy">Terms of Use/Privacy</a></p>
        </footer>
      </div>
    </div>

    {% include analytics.html %}
  </body>
</html>
